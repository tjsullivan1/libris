version: 2
updates:
  # Dependabot does not currently update `uv.lock` for uv-managed projects; keep Python deps updated via a dedicated workflow or a tool that supports uv.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The only dependency ecosystem here Dependabot can actually watch: it does
  # not update uv.lock, so the Python dependencies are covered elsewhere.
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
