name: Security scans

# Static scanners that report and never block. Their findings go to the
# repository's Security -> Code scanning tab (or, for npm audit, the run's
# summary), and every job succeeds whatever they find. Deploy waits on CI, not
# on this, so a new rule in a scanner can never stop a release.
#
# Runs after a merge to main, and on a pull request only when it changes this
# file, so an edit to the scanners can be seen working before it merges.
#
# GitHub ignores SARIF's `suppressions`: a result a scanner reports as
# suppressed in the code (`# nosemgrep`, `#checkov:skip`, ...) still opens an
# alert. So each job drops those results before uploading, and a suppression
# in the code, with its reason beside it, is how a finding is closed (#229).
#
# Already covered elsewhere, so not repeated here: bandit's rules (ruff's `S`
# set, in CI's lint job), pip-audit (CI's security job), and Dependabot's npm
# and Actions alerts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: [.github/workflows/security.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Terraform misconfiguration. Rules that cannot apply here are skipped in
  # .checkov.yaml, and exceptions about one resource sit on that resource.
  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"

      - name: Scan infra
        run: >-
          uvx checkov --config-file .checkov.yaml --directory infra --framework terraform
          --output sarif --output-file-path checkov-results --soft-fail

      - name: Drop results suppressed in the code
        run: >-
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))'
          checkov-results/results_sarif.sarif > kept.sarif && mv -f kept.sarif checkov-results/results_sarif.sarif

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: checkov-results/results_sarif.sarif
          category: checkov

  # The workflows themselves: injection from untrusted input, excessive token
  # permissions, credentials persisted by checkout, risky triggers such as the
  # workflow_run in deploy.yml.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Audit workflows
        # The token lets zizmor's online audits check each action reference
        # against GitHub, for known-vulnerable versions and impostor commits.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx zizmor --format sarif --no-exit-codes .github/workflows > zizmor.sarif

      - name: Drop results suppressed in the code
        run: >-
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))'
          zizmor.sarif > kept.sarif && mv -f kept.sarif zizmor.sarif

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  # Secrets anywhere in history, not only in the files as they are now: a key
  # deleted in a later commit is still published.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location -O "$base/$archive"
          curl --fail --silent --show-error --location -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$archive" gitleaks

      # --redact keeps any secret it finds out of the report, which is uploaded.
      - name: Scan history
        run: >-
          ./gitleaks git --redact --no-banner
          --report-format sarif --report-path gitleaks.sarif --exit-code 0

      - name: Drop results suppressed in the code
        run: >-
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))'
          gitleaks.sarif > kept.sarif && mv -f kept.sarif gitleaks.sarif

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # Code patterns beyond bandit's: the Python, the extension's JavaScript and
  # the Dockerfile. Explicit rulesets rather than `--config auto`, which
  # requires sending usage metrics to Semgrep.
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"

      - name: Scan code
        run: >-
          uvx semgrep scan --metrics=off
          --config p/python --config p/javascript --config p/dockerfile
          --sarif --output semgrep.sarif

      - name: Drop results suppressed in the code
        run: >-
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))'
          semgrep.sarif > kept.sarif && mv -f kept.sarif semgrep.sarif

      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # npm audit has no SARIF output, so it reports to the run's summary. It reads
  # the lockfile, so nothing is installed.
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Audit extension dependencies
        run: |
          {
            echo '## npm audit (extension)'
            echo '```'
            npm audit || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
