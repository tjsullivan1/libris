name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # The server extra is optional, so both states are supported states and
        # both get tested: with it the daemon works, without it every other
        # command still does.
        extras: ["none", "server"]
        include:
          - extras: "none"
            sync-args: ""
          - extras: "server"
            sync-args: "--extra server"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen ${{ matrix.sync-args }}

      # Server tests skip when FastAPI is absent, and skipped tests exit 0. This
      # fails loudly if the extra ever stops installing, rather than letting the
      # suite report green over a server that was never exercised.
      - name: Verify the server extra installed
        if: matrix.extras == 'server'
        run: uv run python -c "import fastapi, uvicorn"

      - name: Run tests
        run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --group lint

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit runtime dependencies
        run: |
          runtime_requirements="$(mktemp -t runtime-requirements.XXXXXX.txt)"
          trap 'rm -f "$runtime_requirements"' EXIT
          uv export --no-hashes --frozen --no-dev --all-extras > "$runtime_requirements"
          uv tool run pip-audit --skip-editable -r "$runtime_requirements"

  # The extension ships no build step and no runtime dependencies, so this job
  # exists only to check it. Without it the extension would be the one part of
  # the repo with no automated checks at all.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check linting
        run: npm run lint

      # Amazon and Goodreads will change their markup, and the failure is
      # silent: the scraper returns nothing and the popup blames the lookup.
      - name: Run scraper tests
        run: npm test
