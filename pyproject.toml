[project]
name = "libris"
version = "0.5.1"
description = "A simple CLI tool to track your reading list in Obsidian"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "titlecase>=2.4",
    "typer>=0.24.1",
]

# The local daemon the browser extension talks to (#52). Optional so the core
# CLI installs and runs without a web stack; cli.py imports it lazily.
[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

# The MCP server an agent drives (#93). Separate from `server` because stdio
# needs no web stack, and optional for the same reason `server` is: the core
# CLI installs without either, and cli.py imports this lazily too.
mcp = [
    "mcp>=2.1.1",
]

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
  "ipython"

]
lint = [
  "ruff"
]
test = [
  "pytest>=9.0.3",
  "pytest-cov",
  # The optional extras deliberately do NOT belong here. This group installs on
  # every `uv sync`, including CI's no-extras leg, whose whole job is to prove
  # the core CLI works without them. Locally, `uv sync --all-extras` runs the
  # whole suite; CI covers each combination as a matrix leg and asserts the
  # imports are present, so a silently-skipped fifty tests fails loudly instead.
]

[project.scripts]
libris = "libris.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libris"]
[tool.hatch.build.targets.wheel.sources]
"src" = ""
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "S", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
