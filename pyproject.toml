[project]
name = "libris"
version = "0.1.0"
description = "A simple CLI tool to track your reading list in Obsidian"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "titlecase>=2.4",
    "typer>=0.24.1",
]
[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
  "ipython"

]
lint = [
  "ruff"
]
test = [
  "pytest>=9.0.3",
  "pytest-cov",
]

[project.scripts]
libris = "libris.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libris"]
[tool.hatch.build.targets.wheel.sources]
"src" = ""
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "S", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
